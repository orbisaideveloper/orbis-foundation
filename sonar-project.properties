sonar.projectKey=orbisaideveloper_orbis-foundation
sonar.organization=orbis

# কভারেজ ফাইল লোকেশন
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# টেস্ট ফাইল ও বিল্ড ফোল্ডার এক্সক্লুশন
sonar.coverage.exclusions=**/*.test.*,**/*.spec.*,**/__tests__/**,node_modules/**,dist/**,build/**,vite.config.*,vitest.config.*
