# ORBIS Foundation - SonarCloud Configuration

# 1. Project Identification
sonar.projectKey=orbisaideveloper_orbis-foundation
sonar.organization=orbis

# 2. Source Code Configuration (আপনার নির্দেশ অনুযায়ী পুরো প্রজেক্ট)
sonar.sources=.
sonar.sourceEncoding=UTF-8

# 3. Global Exclusions (পুরো প্রজেক্ট স্ক্যান করলেও এগুলো স্ক্যান করবে না)
sonar.exclusions=node_modules/**,dist/**,build/**,coverage/**,public/**

# 4. Coverage Report & Test Exclusions (আপনার আগের নিখুঁত কনফিগারেশন)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/**/*.test.tsx,src/**/*.test.ts,src/main.tsx,src/vite-env.d.ts

# 5. Audit First & Quality Gates
sonar.qualitygate.wait=true
