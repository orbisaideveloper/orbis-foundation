services:
  - type: web
    name: orbis-foundation
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: node orbis-server/bridge.cjs
    healthCheckPath: /api/system-stats
    autoDeploy: true
    envVars:
      - key: SOURCE_EXPLORER_ENABLED
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
