name: "ORBIS Foundation CI Pipeline"

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  build-and-audit:
    name: Build, Test & Safety Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Global Type Check (tsc --noEmit)
        run: npm run type-check

      - name: Check for Unintended File Deletions
        run: |
          DELETED_FILES=$(git diff-tree --no-commit-id --name-only -r --diff-filter=D ${{ github.sha }})
          if [ -n "$DELETED_FILES" ]; then
            echo "🚨 CRITICAL ALERT: Files deleted!"
            exit 1
          fi

      - name: Run Tests and Generate Coverage
        id: tests
        continue-on-error: true
        run: npm run coverage
        
      - name: SonarCloud Scan
        id: sonar
        continue-on-error: true
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Sync Commit Snapshot to Time Machine Module
        if: always()
        continue-on-error: true
        run: |
          STATUS="SUCCESS"
          ERR_MSG=""
          if [ "${{ steps.tests.outcome }}" != "success" ] || [ "${{ steps.sonar.outcome }}" != "success" ]; then
            STATUS="FAILED"
            ERR_MSG="Pipeline step failed. Check GitHub Actions logs."
          fi

          COMMIT_HASH="${{ github.sha }}"
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD~1 HEAD)
          for FILE in $CHANGED_FILES; do
            if [ -f "$FILE" ]; then
              CONTENT=$(jq -Rs . < "$FILE")
              curl -X POST "https://orbis-foundation.onrender.com/api/system/time-machine/sync" \
                -H "Content-Type: application/json" \
                -d "{\"filePath\": \"$FILE\", \"commitId\": \"$COMMIT_HASH\", \"status\": \"$STATUS\", \"errorMessage\": \"$ERR_MSG\", \"content\": $CONTENT}"
            fi
          done
