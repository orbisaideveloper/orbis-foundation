name: "ORBIS Foundation CI Pipeline"

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  build-and-audit:
    name: Build, Test & Sonar Scan
    runs-on: ubuntu-latest
  workflow_dispatch:
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
  workflow_dispatch:
          cache: 'npm'
          
      - name: Install Dependencies
        # --legacy-peer-deps ব্যবহার করা হলো যাতে প্যাকেজ কনফ্লিক্টে পাইপলাইন ব্রেক না করে
        run: npm install --legacy-peer-deps
        
      - name: Run Tests and Generate Coverage
        # আপনার build.yml এর রিকোয়ারমেন্ট অনুযায়ী কভারেজ রান করানো হলো
        run: npm run coverage
        
      - name: SonarCloud Scan
        # Docker এরর এড়াতে @master এবং ক্লাউড অ্যাকশন ব্যবহার করা হলো
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
