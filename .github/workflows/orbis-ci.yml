name: "ORBIS Foundation CI Pipeline"

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-audit:
    name: Build, Test & Safety Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
        env:
          HUSKY: 0

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Brain Runtime
        run: npm run build:brain-runtime

      - name: Run Tests and Generate Coverage
        run: npm run coverage

      - name: Knip Dead Code Guard
        run: npm run check:deadcode:ci

      - name: JSCPD Duplication Guard
        run: npm run check:duplicates:ci

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
