Name: "ORBIS Foundation CI Pipeline"

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  build-and-audit:
    name: Build, Test & Sonar Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
        
      - name: Run Tests and Generate Coverage
        run: npm run coverage
        
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Sync Commit Snapshot to Time Machine Module
        if: always()
        continue-on-error: true
        run: |
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }})
          for FILE in $CHANGED_FILES; do
            if [ -f "$FILE" ]; then
              CONTENT=$(jq -Rs . < "$FILE")
              curl -X POST "https://orbis-foundation.onrender.com/api/system/time-machine/sync" \
                -H "Content-Type: application/json" \
                -d "{\"filePath\": \"$FILE\", \"commitId\": \"${{ github.sha }}\", \"content\": $CONTENT}"
            fi
          done
