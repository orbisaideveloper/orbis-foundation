cat << 'EOF' > .github/workflows/orbis-ci.yml
name: ORBIS Phase-01 CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm ci --ignore-scripts

    - name: Run Strict Unit Tests
      run: npm run test --if-present

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@v3.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
EOF

git add .github/workflows/orbis-ci.yml
git commit -m "ci: fix sonarcloud security issues (npm ci and strict version)"
git push
